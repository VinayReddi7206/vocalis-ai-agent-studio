<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Vocalis production architecture</title>
  <desc id="desc">The browser connects to a Next.js application on AWS Lambda. Server routes enforce validation, rate limiting and budget protection before using CallMissed services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1229"/>
      <stop offset="1" stop-color="#151b3f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#8f5cff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20c7d9"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ea2d8"/>
    </marker>
    <style>
      .label{font:700 18px Inter,Segoe UI,sans-serif;fill:#f8fafc}.small{font:500 13px Inter,Segoe UI,sans-serif;fill:#aab7db}.eyebrow{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1.6px;fill:#7dd3fc}.box{fill:#141c3c;stroke:#31406d;stroke-width:1.5}.sub{fill:#19234a;stroke:#42548c;stroke-width:1.2}.line{fill:none;stroke:#8ea2d8;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="210" fill="#6d5dfc" opacity=".08"/>
  <circle cx="150" cy="560" r="240" fill="#22d3ee" opacity=".06"/>

  <text x="60" y="64" class="eyebrow">PRODUCTION REQUEST FLOW</text>
  <text x="60" y="98" class="label" font-size="26">Vocalis architecture</text>
  <text x="60" y="124" class="small">Every paid request crosses the same security and cost-control boundary.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="210" width="230" height="210" rx="22" class="box"/>
    <rect x="85" y="238" width="56" height="56" rx="16" fill="url(#violet)"/>
    <path d="M101 257h24M101 266h24M101 275h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="326" class="label">Browser workspace</text>
    <text x="85" y="351" class="small">Chat · Image · Voice</text>
    <text x="85" y="374" class="small">React 19 client</text>
    <text x="85" y="397" class="small">LiveKit WebRTC media</text>
  </g>

  <path d="M290 315 H370" class="line"/>
  <text x="315" y="296" class="small">HTTPS</text>

  <g filter="url(#shadow)">
    <rect x="370" y="165" width="430" height="300" rx="24" class="box"/>
    <rect x="396" y="190" width="378" height="62" rx="16" fill="url(#violet)"/>
    <text x="418" y="216" class="eyebrow" fill="#fff">AWS LAMBDA FUNCTION URL</text>
    <text x="418" y="239" class="label">Next.js 16 application</text>

    <rect x="396" y="276" width="178" height="70" rx="15" class="sub"/>
    <text x="414" y="303" class="label" font-size="15">API routes</text>
    <text x="414" y="326" class="small">Server-only credentials</text>

    <rect x="596" y="276" width="178" height="70" rx="15" class="sub"/>
    <text x="614" y="303" class="label" font-size="15">Validation</text>
    <text x="614" y="326" class="small">Size and schema limits</text>

    <rect x="396" y="366" width="178" height="70" rx="15" class="sub"/>
    <text x="414" y="393" class="label" font-size="15">Rate limiting</text>
    <text x="414" y="416" class="small">Feature-specific windows</text>

    <rect x="596" y="366" width="178" height="70" rx="15" class="sub"/>
    <text x="614" y="393" class="label" font-size="15">Budget guard</text>
    <text x="614" y="416" class="small">$20 cap + safety reserve</text>
  </g>

  <path d="M800 315 H880" class="line"/>
  <text x="817" y="296" class="small">Bearer API</text>

  <g filter="url(#shadow)">
    <rect x="880" y="185" width="260" height="260" rx="24" class="box"/>
    <rect x="906" y="212" width="56" height="56" rx="16" fill="url(#cyan)"/>
    <path d="M923 228v24M934 223v34M945 231v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="906" y="299" class="label">CallMissed API</text>
    <rect x="906" y="322" width="96" height="38" rx="10" class="sub"/><text x="930" y="346" class="small">Chat</text>
    <rect x="1017" y="322" width="96" height="38" rx="10" class="sub"/><text x="1039" y="346" class="small">Image</text>
    <rect x="906" y="373" width="96" height="38" rx="10" class="sub"/><text x="929" y="397" class="small">Voice</text>
    <rect x="1017" y="373" width="96" height="38" rx="10" class="sub"/><text x="1036" y="397" class="small">Usage</text>
  </g>

  <g>
    <rect x="370" y="510" width="430" height="58" rx="16" fill="#101833" stroke="#29385f"/>
    <circle cx="402" cy="539" r="9" fill="#42d3a7"/>
    <text x="424" y="536" class="label" font-size="14">Operational controls</text>
    <text x="424" y="555" class="small">CloudWatch logs · health endpoint · GitHub Actions verification</text>
  </g>
</svg>
